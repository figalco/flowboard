name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values: tests mock Supabase, but the client module requires these to be set.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (hooks, components)
        run: npx vitest run src/hooks src/components
      - name: Regression tests (full suite incl. App)
        run: npm test
      - name: Build
        run: npm run build
